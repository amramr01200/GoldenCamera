plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.kapt'
}

android {
    namespace 'com.example.goldencamera'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.goldencamera"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildFeatures {
        viewBinding true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    // *** إجبار توحيد إصدارات التبعيات ***
    configurations.all {
        resolutionStrategy {
            force 'com.google.android.material:material:1.11.0'
            force 'androidx.dynamicanimation:dynamicanimation:1.0.0'
            force 'androidx.camera:camera-core:1.3.4'
            force 'androidx.camera:camera-camera2:1.3.4'
            force 'androidx.camera:camera-lifecycle:1.3.4'
            force 'androidx.camera:camera-view:1.3.4'
            force 'androidx.camera:camera-extensions:1.3.4'
        }
    }
}

dependencies {
    // مكتبات Android الأساسية
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'

    // CameraX
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:$camerax_version"
    implementation "androidx.camera:camera-camera2:$camerax_version"
    implementation "androidx.camera:camera-lifecycle:$camerax_version"
    implementation "androidx.camera:camera-view:$camerax_version"
    implementation "androidx.camera:camera-extensions:$camerax_version"

    // ML Kit
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:language-id:17.0.6'
    implementation 'com.google.mlkit:translate:17.0.3'

    // Room
    implementation 'androidx.room:room-runtime:2.6.1'
    implementation 'androidx.room:room-ktx:2.6.1'
    kapt 'androidx.room:room-compiler:2.6.1'

    // Coroutines
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
}
