name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.5'

    - name: Prepare Project Structure & Resources
      run: |
        mkdir -p app/src/main/java/com/example/goldencamera/data
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/mipmap-anydpi-v26

        # ==========================================
        # 1. إعدادات Gradle
        # ==========================================
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories { google(); mavenCentral() }
        }
        rootProject.name = "GoldenCamera"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.1.1' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.0' apply false
            id 'org.jetbrains.kotlin.kapt' version '1.9.0' apply false
        }
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
            id 'org.jetbrains.kotlin.kapt'
        }
        android {
            namespace 'com.example.goldencamera'
            compileSdk 34
            defaultConfig {
                applicationId "com.example.goldencamera"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }
            buildFeatures { viewBinding true }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions { jvmTarget = '17' }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            def camerax_version = "1.3.4"
            implementation "androidx.camera:camera-core:$camerax_version"
            implementation "androidx.camera:camera-camera2:$camerax_version"
            implementation "androidx.camera:camera-lifecycle:$camerax_version"
            implementation "androidx.camera:camera-view:$camerax_version"
            implementation "androidx.camera:camera-extensions:$camerax_version"
            implementation 'io.github.sceneview:arsceneview:2.2.0'
            implementation 'com.google.mlkit:text-recognition:16.0.1'
            implementation 'com.google.mlkit:language-id:17.0.6'
            implementation 'com.google.mlkit:translate:17.0.3'
            implementation 'androidx.room:room-runtime:2.6.1'
            implementation 'androidx.room:room-ktx:2.6.1'
            kapt 'androidx.room:room-compiler:2.6.1'
            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'
            implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
        }
        EOF

        # ==========================================
        # 2. المانيفست (AndroidManifest.xml)
        # ==========================================
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.example.goldencamera">
            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.NFC" />
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="28" />
            <uses-feature android:name="android.hardware.camera.any" android:required="true" />
            <uses-feature android:name="android.hardware.camera.ar" android:required="true" />
            <uses-feature android:name="android.hardware.nfc" android:required="false" />
            <meta-data android:name="com.google.ar.core" android:value="required" />
            <application
                android:allowBackup="true"
                android:icon="@mipmap/ic_launcher"
                android:roundIcon="@mipmap/ic_launcher_round"
                android:label="@string/app_name"
                android:supportsRtl="true"
                android:theme="@style/Theme.GoldenCamera">
                <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <activity android:name=".OcrTranslateActivity" android:exported="false" />
                <activity android:name=".ARMeasureActivity" android:exported="false" />
                <activity android:name=".AdvancedNfcActivity" android:exported="false" />
                <activity android:name=".ElevatorSimActivity" android:exported="false" />
            </application>
        </manifest>
        EOF

        # ==========================================
        # 3. الموارد (ألوان، نصوص، ثيمات)
        # ==========================================
        cat << 'EOF' > app/src/main/res/values/colors.xml
        <resources>
            <color name="gold">#E0B84C</color>
            <color name="gold_bright">#FFD700</color>
            <color name="gold_translucent">#CCFFD700</color>
            <color name="black_deep">#0A0A0A</color>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">GoldenCamera</string>
            <string name="ar_measure_hint">Tap two points to measure</string>
            <string name="switch_language">Target: AR ⇄ EN</string>
            <string name="btn_measure">AR Measure</string>
            <string name="btn_ocr">Translate</string>
            <string name="btn_capture">Capture</string>
            <string name="enable_nfc">Please enable NFC</string>
            <string name="nfc_hint">Hold an NFC card near the back of your phone</string>
            <string name="save_card">Save to Database</string>
            <string name="btn_nfc">NFC Reader</string>
            <string name="btn_elevator">Elevator Sim</string>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/res/values/themes.xml
        <resources>
            <style name="Theme.GoldenCamera" parent="Theme.MaterialComponents.NoActionBar">
                <item name="colorPrimary">@color/gold</item>
                <item name="colorSecondary">@color/gold_bright</item>
                <item name="android:statusBarColor">@color/black_deep</item>
                <item name="android:navigationBarColor">@color/black_deep</item>
            </style>
        </resources>
        EOF

        # ==========================================
        # 4. الأيقونات
        # ==========================================
        cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#0A0A0A" android:pathData="M0,0 h108 v108 h-108 z" />
        </vector>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="108dp" android:height="108dp" android:viewportWidth="108" android:viewportHeight="108">
            <path android:strokeColor="#FFD700" android:strokeWidth="2" android:fillColor="#00000000" android:pathData="M30,30 A20,20 0 0,1 30,50" />
            <path android:strokeColor="#FFD700" android:strokeWidth="2" android:fillColor="#00000000" android:pathData="M24,24 A28,28 0 0,1 24,56" />
            <path android:fillColor="#E0B84C" android:pathData="M54,30 h30 v48 h-30 z" />
            <path android:fillColor="#0A0A0A" android:pathData="M61,38 h6 v40 h-6 z" />
            <path android:fillColor="#0A0A0A" android:pathData="M71,38 h6 v40 h-6 z" />
            <path android:fillColor="#FFD700" android:pathData="M54,20 m-8,0 a8,8 0 1,0 16,0 a8,8 0 1,0 -16,0" />
            <path android:fillColor="#0A0A0A" android:pathData="M54,20 m-4,0 a4,4 0 1,0 8,0 a4,4 0 1,0 -8,0" />
        </vector>
        EOF

        cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
        <?xml version="1.0" encoding="utf-8"?>
        <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_launcher_background" />
            <foreground android:drawable="@drawable/ic_launcher_foreground" />
        </adaptive-icon>
        EOF
        cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

        # ==========================================
        # 5. التصميمات (Layouts)
        # ==========================================
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:background="@color/black_deep">
            <androidx.camera.view.PreviewView android:id="@+id/viewFinder" android:layout_width="match_parent" android:layout_height="match_parent" />
            <TextView android:id="@+id/txtZoom" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_gravity="top|center_horizontal" android:layout_marginTop="24dp" android:background="@color/gold_translucent" android:paddingHorizontal="14dp" android:paddingVertical="6dp" android:text="1.0x" android:textColor="@color/black_deep" android:textStyle="bold" />
            <Button android:id="@+id/btnMeasure" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_gravity="top|start" android:layout_margin="12dp" android:text="@string/btn_measure" android:backgroundTint="@color/gold" android:textColor="@color/black_deep" />
            <Button android:id="@+id/btnOcr" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_gravity="top|end" android:layout_margin="12dp" android:text="@string/btn_ocr" android:backgroundTint="@color/gold_bright" android:textColor="@color/black_deep" />
            <Button android:id="@+id/btnNfc" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_gravity="top|start" android:layout_marginTop="80dp" android:layout_marginStart="12dp" android:text="@string/btn_nfc" android:backgroundTint="@color/gold" android:textColor="@color/black_deep" />
            <Button android:id="@+id/btnElevator" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_gravity="top|start" android:layout_marginTop="140dp" android:layout_marginStart="12dp" android:text="@string/btn_elevator" android:backgroundTint="@color/gold_bright" android:textColor="@color/black_deep" />
            <Button android:id="@+id/btnScreenshot" android:layout_width="56dp" android:layout_height="56dp" android:layout_gravity="center_vertical|end" android:layout_marginEnd="16dp" android:text="📸" android:textSize="22sp" android:backgroundTint="@color/gold_bright" android:textColor="@color/black_deep" />
            <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:layout_gravity="bottom" android:orientation="horizontal" android:padding="16dp">
                <Button android:id="@+id/btnFlash" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="Flash: OFF" android:textColor="@color/black_deep" android:backgroundTint="@color/gold" />
                <Button android:id="@+id/btnCapture" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:layout_marginHorizontal="8dp" android:text="@string/btn_capture" android:textColor="@color/black_deep" android:backgroundTint="@color/gold_bright" android:textStyle="bold" />
                <Button android:id="@+id/btnNight" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="Night: OFF" android:textColor="@color/black_deep" android:backgroundTint="@color/gold" />
            </LinearLayout>
        </FrameLayout>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_ocr_translate.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:background="@color/black_deep">
            <androidx.camera.view.PreviewView android:id="@+id/previewOcr" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" />
            <TextView android:id="@+id/txtOcrResult" android:layout_width="match_parent" android:layout_height="wrap_content" android:padding="10dp" android:maxLines="3" android:ellipsize="end" android:textColor="@color/gold" android:textSize="14sp" />
            <TextView android:id="@+id/txtTranslation" android:layout_width="match_parent" android:layout_height="wrap_content" android:padding="12dp" android:textColor="@color/gold_bright" android:textSize="20sp" android:textStyle="bold" android:maxLines="4" android:ellipsize="end" />
            <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:padding="8dp">
                <Button android:id="@+id/btnSwitchLang" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:layout_marginEnd="8dp" android:text="@string/switch_language" android:backgroundTint="@color/gold" android:textColor="@color/black_deep" />
                <Button android:id="@+id/btnOcrShot" android:layout_width="wrap_content" android:layout_height="wrap_content" android:text="📸" android:textSize="20sp" android:backgroundTint="@color/gold_bright" android:textColor="@color/black_deep" />
            </LinearLayout>
        </LinearLayout>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_ar_measure.xml
        <?xml version="1.0" encoding="utf-8"?>
        <FrameLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent">
            <io.github.sceneview.ar.ARSceneView android:id="@+id/sceneView" android:layout_width="match_parent" android:layout_height="match_parent" />
            <TextView android:id="@+id/txtMeasureResult" android:layout_width="wrap_content" android:layout_height="wrap_content" android:layout_gravity="top|center_horizontal" android:layout_marginTop="32dp" android:background="@color/gold_translucent" android:padding="12dp" android:text="@string/ar_measure_hint" android:textColor="@color/black_deep" android:textStyle="bold" />
        </FrameLayout>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_advanced_nfc.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:padding="16dp" android:background="@color/black_deep">
            <TextView android:id="@+id/txtNfcStatus" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="@string/nfc_hint" android:textColor="@color/gold_bright" android:textSize="18sp" android:textStyle="bold" android:gravity="center" android:padding="16dp" />
            <TextView android:id="@+id/txtNfcUid" android:layout_width="match_parent" android:layout_height="wrap_content" android:textColor="@color/gold_bright" android:textSize="20sp" android:textStyle="bold" android:padding="8dp" />
            <TextView android:id="@+id/txtNfcDetails" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" android:textColor="@color/gold" android:textSize="16sp" android:padding="8dp" android:fontFamily="monospace" />
            <Button android:id="@+id/btnSaveNfc" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="@string/save_card" android:enabled="false" android:backgroundTint="@color/gold" android:textColor="@color/black_deep" android:textStyle="bold" />
        </LinearLayout>
        EOF

        cat << 'EOF' > app/src/main/res/layout/activity_elevator_sim.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android" android:layout_width="match_parent" android:layout_height="match_parent" android:orientation="vertical" android:background="@color/black_deep">
            <io.github.sceneview.SceneView android:id="@+id/sceneViewSim" android:layout_width="match_parent" android:layout_height="0dp" android:layout_weight="1" />
            <TextView android:id="@+id/txtSimStatus" android:layout_width="match_parent" android:layout_height="wrap_content" android:padding="8dp" android:textColor="@color/gold_bright" android:textStyle="bold" android:gravity="center" />
            <LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="horizontal" android:padding="8dp">
                <Button android:id="@+id/btnFloor1" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="1" android:backgroundTint="@color/gold" android:textColor="@color/black_deep" />
                <Button android:id="@+id/btnFloor2" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="2" android:backgroundTint="@color/gold" android:textColor="@color/black_deep" />
                <Button android:id="@+id/btnFloor3" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="3" android:backgroundTint="@color/gold" android:textColor="@color/black_deep" />
                <Button android:id="@+id/btnDoor" android:layout_width="0dp" android:layout_height="wrap_content" android:layout_weight="1" android:text="Door" android:backgroundTint="@color/gold_bright" android:textColor="@color/black_deep" />
            </LinearLayout>
        </LinearLayout>
        EOF

        # ==========================================
        # 6. كود الكوتلن (يتم تصحيح كافة الأخطاء هنا)
        # ==========================================
        cat << 'EOF' > app/src/main/java/com/example/goldencamera/data/ScanRecord.kt
        package com.example.goldencamera.data
        import androidx.room.Entity
        import androidx.room.PrimaryKey
        @Entity(tableName = "scan_records")
        data class ScanRecord(@PrimaryKey(autoGenerate = true) val id: Long = 0, val uid: String, val techList: String, val atqa: String = "", val sa
