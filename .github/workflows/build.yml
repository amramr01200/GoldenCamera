name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle Official
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Prepare Project Structure & Resources
      run: |
        # 1. إنشاء المجلدات الأساسية (بما فيها مجلد الأيقونات)
        mkdir -p app/src/main/java/com/example/goldencamera
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/mipmap-anydpi-v26

        # 2. نقل ملفات الكود (الكوتلن) فقط
        mv *.kt app/src/main/java/com/example/goldencamera/ 2>/dev/null || true

        # 3. نقل ملفات التخطيطات (تجنب ملفات الأيقونات)
        # ننقل فقط الملفات التي تبدأ بـ activity_ أو fragment_ أو layout_ أو dialog_
        mv activity_*.xml app/src/main/res/layout/ 2>/dev/null || true
        mv fragment_*.xml app/src/main/res/layout/ 2>/dev/null || true
        mv layout_*.xml app/src/main/res/layout/ 2>/dev/null || true
        mv dialog_*.xml app/src/main/res/layout/ 2>/dev/null || true

        # 4. إنشاء ملف AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android"
            package="com.example.goldencamera">

            <uses-permission android:name="android.permission.CAMERA" />
            <uses-permission android:name="android.permission.NFC" />
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-feature android:name="android.hardware.camera.any" android:required="true" />
            <uses-feature android:name="android.hardware.nfc" android:required="false" />

            <application
                android:allowBackup="true"
                android:label="@string/app_name"
                android:supportsRtl="true"
                android:theme="@style/Theme.GoldenCamera"
                android:icon="@mipmap/ic_launcher"
                android:roundIcon="@mipmap/ic_launcher_round">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <!-- إضافة بقية الأنشطة إذا كانت موجودة في كودك -->
            </application>
        </manifest>
        EOF

        # 5. إنشاء ملف الألوان
        cat << 'EOF' > app/src/main/res/values/colors.xml
        <resources>
            <color name="gold">#E0B84C</color>
            <color name="gold_bright">#FFD700</color>
            <color name="gold_translucent">#CCFFD700</color>
            <color name="black_deep">#0A0A0A</color>
        </resources>
        EOF

        # 6. إنشاء ملف النصوص
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">GoldenCamera</string>
            <string name="ar_measure_hint">Tap two points to measure</string>
            <string name="switch_language">Target: AR ⇄ EN</string>
            <string name="btn_measure">AR Measure</string>
            <string name="btn_ocr">Translate</string>
            <string name="btn_capture">Capture</string>
            <string name="enable_nfc">Please enable NFC</string>
            <string name="nfc_hint">Hold an NFC card near the back of your phone</string>
            <string name="save_card">Save to Database</string>
            <string name="btn_nfc">NFC Reader</string>
            <string name="btn_elevator">Elevator Sim</string>
        </resources>
        EOF

        # 7. إنشاء الثيم
        cat << 'EOF' > app/src/main/res/values/themes.xml
        <resources>
            <style name="Theme.GoldenCamera" parent="Theme.MaterialComponents.NoActionBar">
                <item name="colorPrimary">@color/gold</item>
                <item name="colorSecondary">@color/gold_bright</item>
                <item name="android:statusBarColor">@color/black_deep</item>
                <item name="android:navigationBarColor">@color/black_deep</item>
            </style>
        </resources>
        EOF

        # 8. إنشاء الأيقونة (الخلفية والمقدمة) في مجلد drawable
        cat << 'EOF' > app/src/main/res/drawable/ic_launcher_background.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp" android:height="108dp"
            android:viewportWidth="108" android:viewportHeight="108">
            <path android:fillColor="#0A0A0A" android:pathData="M0,0 h108 v108 h-108 z" />
        </vector>
        EOF

        cat << 'EOF' > app/src/main/res/drawable/ic_launcher_foreground.xml
        <?xml version="1.0" encoding="utf-8"?>
        <vector xmlns:android="http://schemas.android.com/apk/res/android"
            android:width="108dp" android:height="108dp"
            android:viewportWidth="108" android:viewportHeight="108">
            <path android:strokeColor="#FFD700" android:strokeWidth="2" android:fillColor="#00000000" android:pathData="M30,30 A20,20 0 0,1 30,50" />
            <path android:strokeColor="#FFD700" android:strokeWidth="2" android:fillColor="#00000000" android:pathData="M24,24 A28,28 0 0,1 24,56" />
            <path android:fillColor="#E0B84C" android:pathData="M54,30 h30 v48 h-30 z" />
            <path android:fillColor="#0A0A0A" android:pathData="M61,38 h6 v40 h-6 z" />
            <path android:fillColor="#0A0A0A" android:pathData="M71,38 h6 v40 h-6 z" />
            <path android:fillColor="#FFD700" android:pathData="M54,20 m-8,0 a8,8 0 1,0 16,0 a8,8 0 1,0 -16,0" />
            <path android:fillColor="#0A0A0A" android:pathData="M54,20 m-4,0 a4,4 0 1,0 8,0 a4,4 0 1,0 -8,0" />
        </vector>
        EOF

        # 9. إنشاء ملفات الأيقونة في المجلد الصحيح (mipmap-anydpi-v26)
        cat << 'EOF' > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
        <?xml version="1.0" encoding="utf-8"?>
        <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@drawable/ic_launcher_background" />
            <foreground android:drawable="@drawable/ic_launcher_foreground" />
        </adaptive-icon>
        EOF

        cp app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml

        # 10. إعدادات Gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "GoldenCamera"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.1.1' apply false
            id 'org.jetbrains.kotlin.android' version '1.9.0' apply false
            id 'org.jetbrains.kotlin.kapt' version '1.9.0' apply false
        }
        EOF

        # 11. إعدادات التطبيق والتبعيات
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
            id 'org.jetbrains.kotlin.kapt'
        }

        android {
            namespace 'com.example.goldencamera'
            compileSdk 34

            defaultConfig {
                applicationId "com.example.goldencamera"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            buildFeatures {
                viewBinding true
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'

            def camerax_version = "1.3.4"
            implementation "androidx.camera:camera-core:$camerax_version"
            implementation "androidx.camera:camera-camera2:$camerax_version"
            implementation "androidx.camera:camera-lifecycle:$camerax_version"
            implementation "androidx.camera:camera-view:$camerax_version"
            implementation "androidx.camera:camera-extensions:$camerax_version"

            implementation 'io.github.sceneview:arsceneview:2.2.0'

            implementation 'com.google.mlkit:text-recognition:16.0.1'
            implementation 'com.google.mlkit:language-id:17.0.6'
            implementation 'com.google.mlkit:translate:17.0.3'

            implementation 'androidx.room:room-runtime:2.6.1'
            implementation 'androidx.room:room-ktx:2.6.1'
            kapt 'androidx.room:room-compiler:2.6.1'

            implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.0'
            implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
        }
        EOF

    - name: Build APK
      run: gradle assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: GoldenCamera-APK
        path: app/build/outputs/apk/debug/*.apk
