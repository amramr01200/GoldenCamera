name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Prepare Project Structure & Gradle 8.5
      run: |
        mkdir -p app/src/main/java/com/example/goldencamera
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        mv *.kt app/src/main/java/com/example/goldencamera/ 2>/dev/null || true
        mv *_*.xml app/src/main/res/layout/ 2>/dev/null || true

        if [ -f AndroidManifest.xml ]; then
          mv AndroidManifest.xml app/src/main/
        fi

        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "GoldenCamera"
        include ':app'
        EOF

        cat << 'EOF' > build.gradle
        // Root build file
        EOF

        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application' version '8.1.1'
            id 'org.jetbrains.kotlin.android' version '1.9.0'
        }

        android {
            namespace 'com.example.goldencamera'
            compileSdk 34

            defaultConfig {
                applicationId "com.example.goldencamera"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
        }
        EOF

        # تثبيت Gradle 8.5 واستخدام الـ Wrapper لضمان الاستقرار التام
        gradle wrapper --gradle-version 8.5

    - name: Build APK with Gradle Wrapper
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GoldenCamera-APK
        path: app/build/outputs/apk/debug/*.apk
        
