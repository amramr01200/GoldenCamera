name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Prepare Project Structure & Gradle 8.5
      run: |
        # إنشاء هيكل مجلدات أندرويد القياسي
        mkdir -p app/src/main/java/com/example/goldencamera
        mkdir -p app/src/main/res/layout
        mkdir -p app/src/main/res/values

        # نقل ملفات كوتلين إلى مكانها الصحيح
        mv *.kt app/src/main/java/com/example/goldencamera/ 2>/dev/null || true

        # نقل ملفات التصميم XML
        mv *_*.xml app/src/main/res/layout/ 2>/dev/null || true

        # معالجة ملف الـ Manifest
        if [ -f AndroidManifest.xml ]; then
          mv AndroidManifest.xml app/src/main/
        fi

        # إنشاء ملف settings.gradle بصيغة مستقرة
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "GoldenCamera"
        include ':app'
        EOF

        # إنشاء ملف build.gradle الرئيسي
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath "com.android.tools.build:gradle:8.1.1"
                classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0"
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        task clean(type: Delete) {
            delete rootProject.buildDir
        }
        EOF

        # إنشاء ملف app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.example.goldencamera'
            compileSdk 34

            defaultConfig {
                applicationId "com.example.goldencamera"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
        }
        EOF

        # تثبيت إصدار Gradle 8.5 المستقر حصرياً لمنع أخطاء التوافق
        mkdir -p gradle/wrapper
        cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
        distributionBase=GRADLE_USER_HOME
        distributionPath=wrapper/dists
        distributionUrl=https\://services.gradle.org/distributions/gradle-8.5-bin.zip
        networkTimeout=10000
        validateDistributionUrl=true
        zipStoreBase=GRADLE_USER_HOME
        zipStorePath=wrapper/dists
        EOF

    - name: Build APK with Gradle
      run: |
        chmod +x gradlew || true
        ./gradlew assembleDebug || gradle assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GoldenCamera-APK
        path: app/build/outputs/apk/debug/*.apk
        
